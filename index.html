<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#7357ce"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Jelly Jump — Friends Edition</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,sans-serif;background:#9bdcf4}canvas{display:block;width:100%;height:100%}#hud{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:0;right:0;text-align:center;color:white;font-size:42px;font-weight:900;text-shadow:0 3px 6px #4d3a86;pointer-events:none}#level{font-size:13px;letter-spacing:1px}#sound{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 14px);font-size:23px;background:#ffffffc9;border:0;padding:9px;border-radius:50%;z-index:3}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#27185a80;color:white;text-align:center;padding:18px;overflow:auto;touch-action:pan-y}#panel{background:#50399cf2;border:2px solid #ffffff77;border-radius:26px;padding:20px;width:min(100%,370px);box-shadow:0 12px 50px #1e165c55;max-height:90dvh;overflow-y:auto;touch-action:pan-y}h1{font-size:31px;margin:0 0 8px}p{line-height:1.4;margin:9px 0}button{background:#ffda61;border:0;border-radius:13px;padding:11px 18px;font-weight:850;font-size:17px;color:#533574;cursor:pointer}button.secondary{background:#eee3ff;font-size:14px;padding:9px 12px}input{width:100%;font-size:17px;border:2px solid #cbb8ff;border-radius:12px;padding:11px;margin:7px 0 10px;touch-action:manipulation}#board{margin-top:12px;background:#34226e;border-radius:14px;padding:10px;text-align:left}#board h2{font-size:16px;margin:2px 0 8px;text-align:center}#scores{font-size:14px;max-height:145px;overflow:auto;touch-action:pan-y}#scores div{display:flex;justify-content:space-between;padding:5px 7px;border-bottom:1px solid #ffffff22}small{opacity:.88}#status{font-size:12px;min-height:17px}#actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}#nameLabel{font-size:13px;display:block;text-align:left}#best{font-weight:700}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="score">0</div><div id="level">ΕΠΙΠΕΔΟ 1</div></div><button id="sound" aria-label="Μουσική και ήχος">🔊</button><div id="overlay"><div id="panel"><h1>🍮 JELLY JUMP</h1><p id="message">Πέρνα ανάμεσα από τα εμπόδια!<br>Άγγιξε την οθόνη για να αναπηδήσεις.</p><label id="nameLabel" for="player">ΟΝΟΜΑ ΠΑΙΚΤΗ</label><input id="player" maxlength="18" placeholder="Γράψε το όνομά σου" autocomplete="nickname"><div id="actions"><button id="start">▶ ΠΑΙΞΕ!</button><button class="secondary" id="refresh">🏆 Κατάταξη</button></div><p id="best"></p><div id="board"><h2>🏆 Πίνακας κατάταξης</h2><div id="scores"></div><p id="status"></p></div></div></div><script src="config.js"></script><script>
'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),overlay=$('overlay'),scoreText=$('score'),levelText=$('level'),message=$('message'),bestText=$('best'),start=$('start'),soundBtn=$('sound'),player=$('player'),scoresEl=$('scores'),statusEl=$('status');let W,H,dpr,ground,playing=false,dead=false,score=0,pipes=[],time=0,last=0,spawn=0,muted=localStorage.getItem('jj-muted')==='1',audio=null,musicTimer=0,noteIndex=0;const jelly={x:0,y:0,vy:0,r:23},notes=[392,523.25,587.33,523.25,440,523.25,659.25,523.25];let name=localStorage.getItem('jj-name')||'',localScores=JSON.parse(localStorage.getItem('jj-scores')||'[]');player.value=name;soundBtn.textContent=muted?'🔇':'🔊';const cfg=window.JELLY_CONFIG||{},online=Boolean(cfg.supabaseUrl&&cfg.supabaseAnonKey);function safeName(s){return s.trim().replace(/\s+/g,' ').slice(0,18)}function best(){return Math.max(0,...localScores.filter(r=>r.name===name).map(r=>r.score))}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ground=H-70;jelly.x=Math.min(W*.27,140);if(!playing)jelly.y=H*.43}addEventListener('resize',resize);resize();function level(){return 1+Math.floor(score/5)}function speed(){return Math.min(5.3,2.65+(level()-1)*.32)}function gapSize(){return Math.max(126,Math.min(205,H*.26)-(level()-1)*7)}function reset(){pipes=[];score=0;spawn=0;time=0;dead=false;playing=true;jelly.y=H*.42;jelly.vy=-4;scoreText.textContent='0';levelText.textContent='ΕΠΙΠΕΔΟ 1';overlay.style.display='none';initAudio()}function initAudio(){if(muted)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}function beep(freq,dur=.08,vol=.035,type='sine'){if(muted||!audio)return;try{const o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+dur);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+dur+.01)}catch(e){}}function jump(){if(!playing)return;jelly.vy=-5.9;beep(520,.07)}function finish(){if(dead)return;dead=true;playing=false;beep(170,.23,.07,'triangle');localScores.push({name,score,date:Date.now()});localScores.sort((a,b)=>b.score-a.score);localScores=localScores.slice(0,100);localStorage.setItem('jj-scores',JSON.stringify(localScores));message.textContent=`${name}: ${score} πόντοι! Παίζουμε ξανά;`;bestText.textContent='🏆 Προσωπικό ρεκόρ: '+best();start.textContent='↻ ΞΑΝΑΠΑΙΞΕ';overlay.style.display='flex';renderBoard();if(online&&score>0)submitScore(name,score).then(renderBoard).catch(()=>{statusEl.textContent='Το σκορ κρατήθηκε στη συσκευή, αλλά δεν στάλθηκε online.'})}function pipe(x,top,gap){const pw=68;ctx.fillStyle='#35b979';ctx.strokeStyle='#208e64';ctx.lineWidth=3;ctx.fillRect(x,0,pw,top);ctx.strokeRect(x,-4,pw,top+4);ctx.fillRect(x,top+gap,pw,ground-(top+gap));ctx.strokeRect(x,top+gap,pw,ground-(top+gap));ctx.fillStyle='#54d999';ctx.fillRect(x+8,0,10,top);ctx.fillRect(x+8,top+gap,10,ground-top-gap);for(const yy of [top-20,top+gap]){ctx.fillStyle='#27ad6e';ctx.fillRect(x-6,yy,pw+12,20);ctx.strokeRect(x-6,yy,pw+12,20)}}function drawJelly(){ctx.save();ctx.translate(jelly.x,jelly.y);const stretch=playing?Math.min(.15,Math.abs(jelly.vy)*.018):Math.sin(time*.06)*.04;ctx.scale(1-stretch,1+stretch);ctx.shadowColor='#a846da88';ctx.shadowBlur=18;const gr=ctx.createLinearGradient(-25,-25,25,30);gr.addColorStop(0,'#ffc4f3');gr.addColorStop(.5,'#e47bdb');gr.addColorStop(1,'#9b4ec6');ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(-23,8);ctx.bezierCurveTo(-29,-15,-15,-27,0,-27);ctx.bezierCurveTo(22,-28,30,-9,24,13);ctx.quadraticCurveTo(17,28,0,25);ctx.quadraticCurveTo(-21,29,-23,8);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-9,-7,6,8,0,0,7);ctx.ellipse(10,-7,6,8,0,0,7);ctx.fill();ctx.fillStyle='#34245c';ctx.beginPath();ctx.arc(-8,-5,3.3,0,7);ctx.arc(11,-5,3.3,0,7);ctx.fill();ctx.strokeStyle='#7b338f';ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(1,4,6,.1,Math.PI-.1);ctx.stroke();ctx.fillStyle='#ffffff88';ctx.beginPath();ctx.ellipse(-12,-16,7,3,-.5,0,7);ctx.fill();ctx.restore()}function background(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#80c5f4');sky.addColorStop(.7,'#b7e5f4');sky.addColorStop(1,'#e5e6b4');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);for(let i=0;i<8;i++){const x=((i*170-time*.23)%(W+220)+W+220)%(W+220)-60,y=80+(i*91)%(Math.max(120,ground-170));ctx.fillStyle='#ffffffa8';ctx.beginPath();ctx.ellipse(x,y,37,13,0,0,7);ctx.ellipse(x+22,y-7,27,17,0,0,7);ctx.fill()}ctx.fillStyle='#79c891';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#5baf7a';ctx.fillRect(0,ground,W,9);for(let i=0;i<W/35+2;i++){let x=i*35-(time*.9%35);ctx.fillStyle='#9cdd99';ctx.fillRect(x,ground+24,17,5)}}function frame(t){const dt=Math.min((t-last)/16.667||1,2);last=t;time+=dt;background();if(playing){musicTimer+=dt;if(musicTimer>22){musicTimer=0;beep(notes[noteIndex++%notes.length],.14,.012,'triangle')}jelly.vy+=.31*dt;jelly.y+=jelly.vy*dt;spawn+=dt;if(spawn>Math.max(66,95-(level()-1)*4)){spawn=0;const gap=gapSize(),minTop=65,maxTop=Math.max(minTop+10,ground-gap-70),top=minTop+Math.random()*(maxTop-minTop);pipes.push({x:W+20,top,gap,passed:false})}}for(const p of pipes){if(playing)p.x-=speed()*dt;pipe(p.x,p.top,p.gap);if(playing){if(!p.passed&&p.x+68<jelly.x){p.passed=true;score++;scoreText.textContent=score;levelText.textContent='ΕΠΙΠΕΔΟ '+level();beep(760,.1,.05)}if(jelly.x+jelly.r-7>p.x&&jelly.x-jelly.r+7<p.x+68&&(jelly.y-jelly.r+6<p.top||jelly.y+jelly.r-6>p.top+p.gap))finish()}}pipes=pipes.filter(p=>p.x>-90);if(playing&&(jelly.y+jelly.r>ground||jelly.y-jelly.r<0))finish();drawJelly();requestAnimationFrame(frame)}requestAnimationFrame(frame);function begin(){name=safeName(player.value);if(!name){player.focus();statusEl.textContent='Γράψε πρώτα το όνομά σου.';return}localStorage.setItem('jj-name',name);reset()}start.onclick=begin;canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(playing)jump();else if(document.activeElement!==player)begin()}});soundBtn.onclick=()=>{muted=!muted;localStorage.setItem('jj-muted',muted?'1':'0');soundBtn.textContent=muted?'🔇':'🔊';if(!muted)initAudio()};player.addEventListener('change',()=>{name=safeName(player.value);localStorage.setItem('jj-name',name);bestText.textContent='🏆 Προσωπικό ρεκόρ: '+best()});bestText.textContent='🏆 Προσωπικό ρεκόρ: '+best();function displayScores(rows){scoresEl.replaceChildren();if(!rows.length){scoresEl.textContent='Δεν υπάρχουν ακόμη σκορ.';return}rows.slice(0,10).forEach((r,i)=>{const line=document.createElement('div'),n=document.createElement('span'),s=document.createElement('strong');n.textContent=`${i+1}. ${r.name}`;s.textContent=String(r.score);line.append(n,s);scoresEl.append(line)})}function localBoard(){const top=new Map();for(const r of localScores)top.set(r.name,Math.max(top.get(r.name)||0,r.score));return [...top].map(([name,score])=>({name,score})).sort((a,b)=>b.score-a.score)}async function api(path,opts={}){const base=cfg.supabaseUrl.replace(/\/$/,'');const res=await fetch(base+'/rest/v1/'+path,{...opts,headers:{apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+cfg.supabaseAnonKey,'Content-Type':'application/json',...(opts.headers||{})}});if(!res.ok)throw Error('HTTP '+res.status);return res.status===204?null:res.json()}async function submitScore(n,s){await api('scores',{method:'POST',headers:{Prefer:'return=minimal'},body:JJSON.stringify({player_name:n,score:s})})}async function renderBoard(){displayScores(localBoard());if(!online){statusEl.textContent='Τοπική κατάταξη: σκορ μόνο από αυτή τη συσκευή. Για φίλους χρειάζεται online σύνδεση.';return}statusEl.textContent='Φόρτωση online κατάταξης…';try{const rows=await api('scores?select=player_name,score&order=score.desc&limit=100');const top=new Map();for(const r of rows)top.set(r.name,Math.max(top.get(r.name)||0,r.score));displayScores([...top].map(([name,score])=>({name,score})).sort((a,b)=>b.score-a.score));statusEl.textContent='🌍 Online κατάταξη φίλων'}catch(e){statusEl.textContent='Δεν είναι διαθέσιμη η online κατάταξη. Εμφανίζονται τα τοπικά σκορ.'}}$('refresh').onclick=renderBoard;renderBoard();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
